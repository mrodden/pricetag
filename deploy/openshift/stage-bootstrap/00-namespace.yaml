apiVersion: v1
kind: Namespace
metadata:
  name: enmaas-stage
  labels:
    app.kubernetes.io/part-of: enmaas
    environment: stage
  annotations:
    enmaas.redhat.com/purpose: "Temporary stage while AppSRE onboarding completes"
    enmaas.redhat.com/owner: "OCTO EnMaaS"
    enmaas.redhat.com/expires-after: "2026-10-17"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: enmaas-stage-budget
  namespace: enmaas-stage
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.storage: 50Gi
    persistentvolumeclaims: "5"
    pods: "24"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: enmaas-stage-defaults
  namespace: enmaas-stage
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
---
# Start closed. Workload changes add narrowly scoped DNS, router, provider,
# Kubernetes API and database policies alongside the workload that needs them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-stage-default-deny
  namespace: enmaas-stage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
