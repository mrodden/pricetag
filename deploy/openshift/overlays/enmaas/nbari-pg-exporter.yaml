# rds-postgres-exporter: nbari/pg_exporter (https://github.com/nbari/pg_exporter)
# for the EnMaaS metering database on AWS RDS. Replaces the prometheus-community
# exporter -- nbari's metric schema (pg_system_*, pg_ssl_*, pg_stat_io_*,
# pg_stat_activity_max_connections, ...) backs the richer Grafana dashboards.
#
# Keeps the rds-postgres-exporter identity so nothing downstream changes:
#   - Service is named rds-postgres-exporter, so the annotation-driven enmaas
#     Prometheus job scrapes it as job="rds-postgres-exporter" (and the stable
#     instance relabel in open-models still applies).
#   - pod carries app.kubernetes.io/name=rds-postgres-exporter, so the existing
#     NetworkPolicy (enmaas-allow-rds-exporter-egress) grants RDS egress +
#     scrape ingress. It therefore listens on 9187, not nbari's 9432 default.
#
# Uses the least-privilege metering_reader DSN (metering-readonly-db-url); that
# role has no pg_monitor, which constrains a few collectors -- see the DRIFT
# notes on the disabled/empty collectors below. Image pinned by tag + multi-arch
# index digest (rule #2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nbari-pg-exporter
  labels:
    app.kubernetes.io/name: rds-postgres-exporter
    app.kubernetes.io/component: nbari
    app.kubernetes.io/part-of: enmaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-postgres-exporter
      app.kubernetes.io/component: nbari
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-postgres-exporter
        app.kubernetes.io/component: nbari
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: pg-exporter
          image: ghcr.io/nbari/pg_exporter:0.22.0@sha256:87d95b921574ebb2a5c2514e57a5f44c9503cbb58e6537ed2c09c984393f00ce
          imagePullPolicy: IfNotPresent
          args:
            - --port
            - "9187"
            # system stays off: on RDS it reports the exporter pod's host, not DB.
            - --collector.stat
            - --collector.stat_io
            - --collector.locks
            - --collector.replication
            - --collector.index
            - --collector.sequences
            - --collector.tls
            - --collector.exporter
            # DRIFT: database is DISABLED -- metering_reader has no CONNECT on
            # RDS's internal rdsadmin DB ("permission denied for database
            # rdsadmin"), and nbari fails the ENTIRE scrape on any collector
            # error. Re-enable once the role is granted access.
            - --no-collector.database
            # DRIFT: statements emits nothing until the pg_stat_statements
            # extension is CREATEd in the target DB (the preloaded library is
            # not enough). nbari does not error on the missing extension, so it
            # is safe to leave enabled; metrics appear once the extension exists.
            - --collector.statements
            - --no-collector.system
          env:
            - name: PG_EXPORTER_DSN
              valueFrom:
                secretKeyRef:
                  name: metering-readonly-db-url
                  key: READ_DATABASE_URL
          ports:
            - name: metrics
              containerPort: 9187
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # No dedicated health endpoint; /metrics returns 200 even when the DB
          # is down. Lenient thresholds so a scrape colliding with a probe
          # (nbari serializes scrapes) does not flap the pod.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: rds-postgres-exporter
  labels:
    app.kubernetes.io/part-of: enmaas
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
  selector:
    app.kubernetes.io/name: rds-postgres-exporter
