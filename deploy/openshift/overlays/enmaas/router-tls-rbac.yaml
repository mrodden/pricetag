# The EnMaaS public hosts use certificates stored as kubernetes.io/tls Secrets
# (`enmaas-public-tls`, with older per-host Secrets retained for rollback)
# referenced through Route
# spec.tls.externalCertificate. The Secrets are issued and renewed by
# cert-manager from the Certificates in tls-certificates.yaml (never
# committed, never hand-edited - the controller owns their contents);
# deploy.sh refuses to render Routes that reference a Secret which does not
# exist, so issuance must complete before the first deploy. The ingress router service account must be able to read
# exactly those Secrets, and nothing else in the namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-enmaas-public-tls
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [enmaas-public-tls]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-enmaas-public-tls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-enmaas-public-tls
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
---
# Legacy rollback access. Remove after the shared certificate has soaked and
# the supported OpenShift router carries the HAProxy backport.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-api-enmaas-tls
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [api-enmaas-tls]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-api-enmaas-tls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-api-enmaas-tls
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-dashboard-enmaas-tls
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [dashboard-enmaas-tls]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-dashboard-enmaas-tls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-dashboard-enmaas-tls
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
