# Controlled EnMaaS canary for validating a pushed Metering image. This file
# is deliberately not a Kustomize resource: apply it explicitly for a test,
# port-forward to its ClusterIP Service, then delete both objects afterwards.
#
# WARNING: the canary uses the same METERING_DB_URL as the live service, so
# starting it runs the image's migrations against the production database.
# Only run a canary for an image whose schema changes are meant to ship.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering-service-api-canary
  namespace: enmaas
  labels:
    app: metering-service-api-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metering-service-api-canary
  template:
    metadata:
      labels:
        app: metering-service-api-canary
    spec:
      containers:
        - name: metering-service
          image: image-registry.openshift-image-registry.svc:5000/enmaas/metering-service@${METERING_CANARY_IMAGE_DIGEST}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: METERING_DB_URL
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MONTHLY_TOKEN_QUOTA
              value: "10000000000"
            - name: USER_MANAGEMENT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: metering-user-management-api
                  key: token
            - name: USAGE_REPORT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: metering-partner-api
                  key: usage-report
            - name: MODEL_POLICY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: metering-partner-api
                  key: model-policy
            - name: MODEL_CATALOG_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: metering-partner-api
                  key: model-catalog
            # PARTNER_USER_KEY_GROUP is intentionally absent: canary runs keep
            # key operations at 503 unless set explicitly for a test.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: metering-service-api-canary
  namespace: enmaas
  labels:
    app: metering-service-api-canary
spec:
  type: ClusterIP
  selector:
    app: metering-service-api-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
