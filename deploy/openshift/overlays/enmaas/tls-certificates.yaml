# Public TLS certificates for the EnMaaS hostnames.
#
# deploy.sh refuses to apply the Routes unless enmaas-public-tls exists as a
# kubernetes.io/tls Secret. It covers both public hostnames so the router uses
# one certificate context for API and dashboard traffic. The older per-host
# certificates remain temporarily as rollback material. These
# Certificate resources are what create and then continuously renew them -
# the Secrets are issued by cert-manager, not hand-built, and must not be
# edited or replaced by hand (the controller will overwrite the contents).
#
# Prerequisite (one-time per cluster): deploy/openshift/cert-manager/
# installs the operator and the letsencrypt-prod ClusterIssuer. On a fresh
# cluster, apply these Certificates and wait for readiness BEFORE running
# deploy.sh, otherwise its TLS preflight fails by design:
#
#   oc apply -f deploy/openshift/cert-manager/00-operator.yaml
#   oc -n cert-manager rollout status deploy/cert-manager --timeout=300s
#   oc apply -f deploy/openshift/cert-manager/01-clusterissuer.yaml
#   oc -n enmaas apply -f deploy/openshift/overlays/enmaas/tls-certificates.yaml
#   oc -n enmaas wait --for=condition=Ready certificate --all --timeout=300s
#
# Renewal is automatic at 60 days (30 days before the 90-day expiry) and the
# router picks up the rotated Secret without a restart, because the Routes
# reference it through spec.tls.externalCertificate (see router-tls-rbac.yaml
# for the read access that requires).
#
# NOTE: HTTP-01 validation requires the public DNS name to already resolve to
# this cluster's router. The records live in app-interface
# (data/aws/app-sre/dns/devshift.net.yaml, app-sre account), so DNS must be in
# place before issuance will succeed.
#
# Shared SAN certificate: immediate mitigation for HAProxy BUG/MEDIUM
# edf6e39, backported in 2.8.28. OCP 4.22.15 carries HAProxy 2.8.18 and can
# resume a TLS session across different certificate contexts. Serving the same
# certificate for both EnMaaS names prevents the observed hostname mismatch;
# the router update is still required for router-wide isolation.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: enmaas-public-devshift-net
  labels:
    app.kubernetes.io/part-of: enmaas
spec:
  secretName: enmaas-public-tls
  commonName: ${GATEWAY_HOST}
  dnsNames:
    - ${GATEWAY_HOST}
    - ${DASHBOARD_HOST}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
  secretTemplate:
    labels:
      app.kubernetes.io/part-of: enmaas
      enmaas.redhat.com/tls-purpose: public-shared-san
---
# Legacy per-host certificate retained during the mitigation rollback window.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-enmaas-devshift-net
  labels:
    app: praxis
spec:
  secretName: api-enmaas-tls
  commonName: ${GATEWAY_HOST}
  dnsNames:
    - ${GATEWAY_HOST}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h    # 90d
  renewBefore: 720h  # renew at 60d
  secretTemplate:
    labels:
      app: praxis
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dashboard-enmaas-devshift-net
  labels:
    app: metering-service
spec:
  secretName: dashboard-enmaas-tls
  commonName: ${DASHBOARD_HOST}
  dnsNames:
    - ${DASHBOARD_HOST}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
  secretTemplate:
    labels:
      app: metering-service
