# postgres_exporter for the EnMaaS metering database on AWS RDS.
#
# Lives with the application that owns the database rather than with the
# monitoring stack: the exporter authenticates with the metering service's
# read-only credentials and only makes sense where that Secret exists (the
# enmaas profile; dogfood still runs CNPG, whose operator exports its own
# metrics).
#
# Discovery is annotation-driven: the Prometheus in the enmaas-monitoring
# namespace (redhat-et/open-models, deployments/enmaas/monitoring) scrapes any
# annotated Service in this namespace, so no scrape_config change is needed to
# add or remove this exporter. Ingress on 9187 and egress to the RDS subnet are
# granted by enmaas-allow-monitoring-scrape / enmaas-allow-rds-exporter-egress
# in network-policy.yaml.
#
# Credentials: DATA_SOURCE_NAME comes from the existing read-only Secret
# (metering_reader). No new credentials, no superuser, and sslmode=require in
# that URL matches the server-side rds.force_ssl enforcement.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-postgres-exporter
  labels:
    app.kubernetes.io/name: rds-postgres-exporter
    app.kubernetes.io/part-of: enmaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-postgres-exporter
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: postgres-exporter
          # v0.15.0, multi-arch index digest (not the per-arch manifest, so the
          # pin stays valid if a node architecture ever changes).
          image: quay.io/prometheuscommunity/postgres-exporter@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
          imagePullPolicy: IfNotPresent
          # The least-privilege metering_reader role cannot inspect rdsadmin or
          # execute pg_ls_waldir. These collectors therefore return no metrics
          # and log a permission error every 30 seconds. Disable only those two
          # rather than granting broad RDS monitoring privileges to an
          # application-owned credential; all dashboard queries use the
          # remaining collectors.
          args:
            - --no-collector.database
            - --no-collector.wal
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: metering-readonly-db-url
                  key: READ_DATABASE_URL
          ports:
            - name: metrics
              containerPort: 9187
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rds-postgres-exporter
  labels:
    app.kubernetes.io/part-of: enmaas
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
  selector:
    app.kubernetes.io/name: rds-postgres-exporter
